name: Electron (Windows) artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Electron app (NSIS + portable)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test Electron policies
        run: npm test

      - name: Build Electron dist
        run: npm run electron:dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samuraibff-electron-windows
          path: dist/electron/**
