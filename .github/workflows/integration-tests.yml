name: Integration tests

on:
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly (UTC)
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: Full backend test suite (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.4.1582

      - name: Setup buf (protobuf)
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.57.2"

      - name: Cache Clojure/Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cpcache
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Prep deps
        run: clojure -P

      - name: Generate + compile protobuf stubs
        run: clojure -T:build proto+compile

      - name: Run full test suite
        run: clojure -X:test
