appId: ai.nanosamurai.samuraibff
productName: samuraibff

files:
  - "electron/**/*"
  - "resources/public/**/*"
  - "build/icon.png"

directories:
  buildResources: "build"
  output: "dist/electron"

asar: true

win:
  icon: "icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: "icon.ico"
  uninstallerIcon: "icon.ico"
