rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT

appender.console.type = Console
appender.console.name = STDOUT
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = debug
appender.console.layout.type = PatternLayout
# We set alwaysWriteExceptions=false so exceptions are rendered ONLY via the pattern (%throwable)
# and don't get duplicated.
appender.console.layout.alwaysWriteExceptions = false

# Notes:
# - %X is the log4j2 ThreadContext (MDC). When empty it renders as "{}", so we strip it.
# - ex-info's (ex-data e) is not automatically logged by log4j2; you must log it explicitly
#   as part of the message/kv map (we do this in a few critical places now).
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} | %t | %-5p | [%c] %x%notEmpty{ %replace{%X}{\\{\\}}{}} %highlight{%m}%n%throwable