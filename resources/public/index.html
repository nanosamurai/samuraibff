<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nanosamur.ai</title>
  <style>
    :root {
      --bg:#0b0f14;
      --panel:#0f1620;
      --panel2:#0c121b;
      --line:#223046;
      --txt:#e6f0ff;
      --muted:#9fb2c9;
      --ok:#6BCBFF;
      --bad:#FF5C7A;
      --accent:#A88BFF;
      --shadow: rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    html, body {height:100%}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}

    a{color:inherit;text-decoration:none}

    #app{height:100%}

    /* --- Layout shell --- */

    .app{height:100vh;display:flex;flex-direction:column}

    .topbar{
      height:56px;
      display:flex;
      align-items:center;
      gap:16px;
      padding:10px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(15,22,32,.88);
      backdrop-filter: blur(8px);
    }

    .brand{display:flex;align-items:center;gap:12px;min-width:220px}
    .logo{width:32px;height:32px;border-radius:8px;object-fit:cover;border:1px solid rgba(34,48,70,.7)}
    .brand-name{font-weight:750;letter-spacing:.2px}

    .breadcrumbs{flex:1;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
    .crumb{display:inline-flex;align-items:center;gap:8px}
    .sep{opacity:.6}
    .crumb-link{color:var(--muted)}
    .crumb-link:hover{color:var(--txt)}

    .body{flex:1;display:flex;min-height:0}

    /* --- Mobile nav drawer (off-canvas) --- */

    .menu-btn{display:none}

    .drawer-overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.58);
      z-index:1100;
    }

    .drawer{
      position:fixed;
      top:0; left:0; bottom:0;
      width:min(320px, 86vw);
      background:rgba(15,22,32,.98);
      border-right:1px solid rgba(34,48,70,.8);
      box-shadow:0 20px 60px rgba(0,0,0,.55);
      padding:14px;
      overflow:auto;
      z-index:1101;
      transform: translateX(-102%);
      transition: transform 160ms ease-out;
    }

    .drawer.open{transform: translateX(0)}

    .drawer-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:4px 0 10px 0;
      border-bottom:1px solid rgba(34,48,70,.55);
      margin-bottom:10px;
    }

    /* --- Mobile list cards --- */

    .list{display:flex;flex-direction:column;gap:10px}

    .list-item{
      background:rgba(15,22,32,.85);
      border:1px solid rgba(34,48,70,.7);
      border-radius:14px;
      padding:12px;
      box-shadow:0 10px 30px var(--shadow);
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .list-item-title{font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .list-item-sub{font-size:12px;color:var(--muted)}
    .list-item-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:12px}
    .list-item-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

    .btn.icon{
      padding:8px 10px;
      min-width:40px;
    }

    .sidebar{
      width:260px;
      border-right:1px solid var(--line);
      background:rgba(15,22,32,.65);
      padding:14px;
      overflow:auto;
    }

    .sidebar-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

    .nav-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid transparent;
      color:var(--muted);
    }

    .nav-item:hover{background:rgba(12,18,27,.8);color:var(--txt);border-color:rgba(34,48,70,.45)}
    .nav-item.active{background:rgba(12,18,27,.95);color:var(--txt);border-color:rgba(168,139,255,.35)}

    .main{flex:1;min-width:0;min-height:0;padding:16px;overflow:auto}

    /* --- Common UI primitives --- */

    .card{background:rgba(15,22,32,.85);border:1px solid rgba(34,48,70,.7);border-radius:14px;padding:14px;box-shadow:0 10px 30px var(--shadow)}
    .card-title{font-weight:700;margin-bottom:10px}

    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

    input, button, select{
      border-radius:10px;
      border:1px solid rgba(34,48,70,.8);
      background:var(--panel2);
      color:var(--txt);
      padding:9px 10px;
    }

    input{min-width:240px}

    button{cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid rgba(34,48,70,.8);background:var(--panel2)}
    .btn:hover{border-color:rgba(168,139,255,.35)}
    .btn.primary{background:rgba(168,139,255,.18);border-color:rgba(168,139,255,.45)}
    .btn.primary:hover{background:rgba(168,139,255,.24)}
    .btn.ghost{background:transparent}

    .muted{color:var(--muted)}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}

    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid rgba(34,48,70,.8);background:rgba(12,18,27,.7)}
    .badge.ok{border-color:rgba(107,203,255,.45);color:rgba(230,240,255,.95)}
    .badge.bad{border-color:rgba(255,92,122,.55);color:rgba(255,92,122,.95)}
    .badge.muted{border-color:rgba(34,48,70,.8);color:var(--muted)}
    /* Used for ASR partials: more "draft" look + typing animation. */
    .badge.muted.typing{
      border-style: dashed;
      background: rgba(12,18,27,.45);
      padding: 2px 10px;
      gap: 6px;
    }

    .typing-dots{
      display:inline-block;
      width: 22px;
      height: 10px;
      position: relative;
      transform: translateY(1px);
    }

    .typing-dots::before, .typing-dots::after, .typing-dots span{
      content:"";
      position:absolute;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 99px;
      background: var(--muted);
      opacity: .35;
      transform: translateY(-50%);
      animation: typingDots 1.05s infinite ease-in-out;
    }

    .typing-dots::before{left:0; animation-delay:0s}
    .typing-dots span{left:9px; animation-delay:.15s}
    .typing-dots::after{left:18px; animation-delay:.3s}

    @keyframes typingDots{
      0%, 80%, 100% {opacity: .25; transform: translateY(-50%) translateY(0)}
      40% {opacity: .95; transform: translateY(-50%) translateY(-2px)}
    }

    /* --- Pages --- */

    .page{display:flex;flex-direction:column;gap:12px;min-height:0}

    .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
    .page-title{font-size:20px;font-weight:780;margin-bottom:4px}

    /* --- Live recording --- */

    .controls{padding:12px 12px 10px;border-radius:14px;border:1px solid rgba(34,48,70,.7);background:rgba(15,22,32,.5)}
    .controls-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
    .field{display:flex;flex-direction:column;gap:6px}
    .label{font-size:12px;color:var(--muted)}
    .spacer{flex:1}
    .hint{margin-top:10px;font-size:12px;color:var(--muted)}

    .stream-controls{padding-top:10px}

    .stream-controls-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .stream-controls-title{display:flex;flex-direction:column;gap:4px;min-width:0}
    .stream-controls-title-text{font-weight:750;letter-spacing:.15px}

    .stream-controls-body{display:flex;flex-direction:column;gap:10px}

    .sc-divider{height:1px;background:rgba(34,48,70,.6)}

    /* Flex-based "grid" (wraps naturally on smaller widths) */
    .sc-grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
    .sc-cell{flex:1 1 240px;min-width:240px;max-width:420px}
    .sc-cell.sc-span-2{flex:2 1 520px;max-width:none}

    .checkbox-group{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

    .checkbox-row{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border:1px solid rgba(34,48,70,.45);
      border-radius:10px;
      background:rgba(12,18,27,.22);
    }

    .checkbox-row input{min-width:auto}
    .checkbox-row label{cursor:pointer;color:var(--txt);font-size:13px}

    /* --- Searchable dropdown (language select) --- */

    .dropdown{position:relative;min-width:240px}

    .dropdown-trigger{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:space-between;
      border-radius:10px;
      border:1px solid rgba(34,48,70,.8);
      background:var(--panel2);
      color:var(--txt);
      padding:9px 10px;
      cursor:pointer;
      text-align:left;
    }

    .dropdown-trigger:hover{border-color:rgba(168,139,255,.35)}

    .dropdown-flag{width:20px;display:inline-flex;justify-content:center;flex:0 0 auto}
    .dropdown-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dropdown-caret{opacity:.75;flex:0 0 auto}

    .dropdown-menu{
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      right:0;
      z-index:50;
      background:rgba(15,22,32,.98);
      border:1px solid rgba(34,48,70,.8);
      border-radius:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }

    .dropdown-search{padding:10px;border-bottom:1px solid rgba(34,48,70,.6)}
    .dropdown-search input{width:100%;min-width:0}

    .dropdown-items{max-height:320px;overflow:auto}

    .dropdown-item{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:9px 10px;
      border:0;
      border-bottom:1px solid rgba(34,48,70,.35);
      background:transparent;
      color:var(--txt);
      cursor:pointer;
      text-align:left;
    }

    .dropdown-item:last-child{border-bottom:0}
    .dropdown-item:hover{background:rgba(12,18,27,.6)}

    .dropdown-item.active{
      background:rgba(168,139,255,.12);
      box-shadow:0 0 0 2px rgba(168,139,255,.10) inset;
    }

    .dropdown-item-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dropdown-item-code{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;font-size:12px}
    .dropdown-empty{padding:10px}

    .split{display:flex;gap:12px;min-height:0}
    .split-main{flex:1;min-width:0;min-height:0}
    .split-side{width:min(380px, 32vw);min-height:0}

    .transcript{height:calc(100vh - 56px - 16px - 16px - 68px);min-height:340px}
    .transcript-feed{height:100%;overflow:auto;padding-right:6px}
    .empty{padding:18px;border-radius:14px;border:1px dashed rgba(34,48,70,.6);background:rgba(12,18,27,.35)}
    .empty-title{font-weight:700;margin-bottom:8px}

    /* --- Transcript thread (Slack-like) --- */

    .msg{display:flex;gap:12px;padding:10px 6px}
    .msgBody{flex:1;min-width:0}
    .msgHeader{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
    .who{font-weight:650}
    .ts{color:var(--muted);font-size:12px}

    .avatar{
      width:28px;height:28px;border-radius:10px;
      border:1px solid rgba(34,48,70,.7);
      background: #101a26;
      flex:0 0 auto;
      display:grid; place-items:center;
      font-size:12px; color:var(--txt);
      user-select:none;
    }

    .bubble{
      display:inline-block;
      max-width: 920px;
      padding:10px 12px;
      border:1px solid rgba(34,48,70,.7);
      border-radius:16px;
      background: rgba(12,18,27,.72);
      line-height:1.45;
      white-space:pre-wrap;
      word-wrap:break-word;
    }

    .bubble.draft{border-style:dashed;opacity:.92}

    /* --- Karaoke word highlighting --- */

    .karaoke{display:inline;}

    .karaoke .word{
      display:inline;
      padding:1px 2px;
      border-radius:6px;
      cursor:pointer;
      user-select:none;
    }

    .karaoke .word:hover{
      background:rgba(168,139,255,.12);
    }

    .karaoke .word.active{
      /* slightly warmer (yellow-ish) highlight for dark theme readability */
      background:rgba(255, 214, 88, .18);
      box-shadow: 0 0 0 2px rgba(255, 214, 88, .20) inset;
      color:rgba(255, 244, 214, .98);
    }

    .badge.refined{
      color: rgba(107,203,255,.95);
      border-color: rgba(107,203,255,.35);
      box-shadow: 0 0 0 3px rgba(107,203,255,.08) inset;
    }

    .right-panel{display:flex;flex-direction:column;min-height:0;height:calc(100vh - 56px - 16px - 16px - 68px)}

    .tabs{display:flex;gap:8px;margin-bottom:10px}
    .tab{padding:7px 10px;border-radius:10px;border:1px solid rgba(34,48,70,.7);background:rgba(12,18,27,.6)}
    .tab.active{border-color:rgba(168,139,255,.45);background:rgba(168,139,255,.14)}

    .right-panel-body{flex:1;display:flex;flex-direction:column;min-height:0}

    .ws-indicator{display:flex;gap:12px;align-items:center;margin-bottom:10px}
    .pill{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
    .dot{width:10px;height:10px;border-radius:99px;background:var(--muted)}
    .dot.ok{background:var(--ok)}
    .dot.bad{background:var(--bad)}

    .log{flex:1;min-height:0;overflow:auto;padding:10px;border-radius:12px;border:1px solid rgba(34,48,70,.6);background:rgba(12,18,27,.35);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;font-size:12px;white-space:pre-wrap}
    .log-line{padding:2px 0}

    /* --- Table --- */

    .table{width:100%;border-collapse:separate;border-spacing:0}
    .table th{font-size:12px;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid rgba(34,48,70,.7)}
    .table td{padding:10px 10px;border-bottom:1px solid rgba(34,48,70,.35)}
    .table tr:hover td{background:rgba(12,18,27,.35)}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    /* --- Modal --- */

    .modal-overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.58);
      display:flex; align-items:center; justify-content:center;
      padding:18px;
      z-index:1000;
    }

    .modal{
      width:min(720px, 96vw);
      max-height:min(80vh, 720px);
      overflow:auto;
      background:rgba(15,22,32,.98);
      border:1px solid rgba(34,48,70,.8);
      border-radius:14px;
      padding:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.55);
    }

    .modal-title{font-weight:800;font-size:16px;margin-bottom:10px}

    @media (max-width: 768px) {
      .menu-btn{display:inline-flex}
      .sidebar{display:none}
      .split{flex-direction:column}
      .split-side{width:100%}
      .right-panel,.transcript{height:auto}
      input{min-width:0;width:100%}
      .grid-2{grid-template-columns:1fr}
      .dropdown{min-width:0;width:100%}

      .topbar{flex-wrap:wrap;height:auto}
      .brand{min-width:0}
      .breadcrumbs{flex-basis:100%}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Cache-bust the JS bundle in dev to avoid index.html <-> main.js mismatches
    // (which would make CSS classes not line up with the rendered DOM).
    (function(){
      var s = document.createElement('script');
      s.src = '/js/main.js?v=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
